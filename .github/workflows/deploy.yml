name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r application/backend/requirements-api.txt
          python -m pip install -e application/backend
          python -m pip install pytest

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          cd application/backend
          pytest

      - name: Package Application
        run: |
          # Create a clean tarball excluding venvs, databases, logs, and untracked configs
          tar --exclude='.venv' \
              --exclude='application/.venv' \
              --exclude='**/.venv' \
              --exclude='**/__pycache__' \
              --exclude='**/.pytest_cache' \
              --exclude='application/data' \
              --exclude='bilingual_reader.db' \
              --exclude='application/web-app/config.js' \
              --exclude='.git' \
              -czf ../release.tar.gz .
          mv ../release.tar.gz .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-reader-release
          path: release.tar.gz
          retention-days: 7
