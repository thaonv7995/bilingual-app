name: BilingualReader
options:
  bundleIdPrefix: com.bilingual.reader
targets:
  BilingualReader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - "README.md"
          - "project.yml"
          - "BilingualReader.xcodeproj"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UILaunchScreen:
          UIColorName: SplashBackground
          UIImageName: SplashIcon
          UIImageRespectsSafeAreaInsets: false
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AI Companion cần quyền truy cập microphone để hội thoại bằng giọng nói với bạn về cuốn sách đang đọc."
        CODE_SIGNING_ALLOWED: true

schemes:
  BilingualReader:
    build:
      targets:
        BilingualReader: all
    run:
      environmentVariables:
        OS_ACTIVITY_MODE: "disable"
